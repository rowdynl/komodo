# Batman has gadgets. You have this. A collection of tools you didn’t know you needed until 
# exactly five seconds before reaching for them. Firefox handles your browsing heroics, code‑server 
# turns any machine into your personal bat‑cave IDE, and IT‑Tools supplies every random 
# utility that saves your day at 3 AM. It’s not a stack — it’s your “because I can” toolkit.
name: utility-belt

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    networks:
      - backend
      - web
    environment:
      - DEFAULT_WORKSPACE=/config/workspace
      - LANGUAGE=en_US.UTF-8
      - LANG=en_US.UTF-8
      - PUID=${PUID}
      - PGID=${PGID}
      - S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0
      - S6_VERBOSITY=1
      - S6_STAGE2_HOOK=/docker-mods
      - TZ=${TZ}
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - EXTENSIONS_GALLERY={"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","cacheUrl":"https://vscode.blob.core.windows.net/gallery/index","itemUrl":"https://marketplace.visualstudio.com/items"}
    volumes:
      - code-server:/config
      - /repos/komodo:/config/workspace/repos/komodo
      - /mnt/prime-ds/docker/hass/config:/config/workspace/home-assistant-prime-ds
      - /mnt/docker/volumes/esphome:/config/workspace/repos/esphome
      - /mnt/docker/volumes/home-assistant:/config/workspace/home-assistant
      - /mnt/docker/volumes/traefik:/config/workspace/traefik
    restart: unless-stopped
    mem_limit: 1152m    
    cpus: 1
    security_opt:
      - label=disable
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`code-server.${DOMAIN}`)"
      - "traefik.http.routers.code-server.entrypoints=websecure"
      - "traefik.http.routers.code-server.tls.certresolver=letsencrypt"
      - "traefik.http.routers.code-server.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.code-server.loadbalancer.server.port=8443"
  
  dbgate:
    container_name: dbgate
    image: dbgate/dbgate
    networks:
      - backend
      - cache
      - web
    volumes:
      - dbgate:/root/.dbgate
    environment:
      - OAUTH_AUTH=https://auth.${DOMAIN}/application/o/authorize/
      - OAUTH_TOKEN=https://auth.${DOMAIN}/application/o/token/
      - OAUTH_LOGOUT=https://auth.${DOMAIN}/application/o/dbgate/end-session/
      - OAUTH_CLIENT_ID=${DBGATE_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${DBGATE_OAUTH_CLIENT_SECRET}
      - OAUTH_LOGIN_FIELD=email
      - OAUTH_SCOPE=openid email profile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbgate.rule=Host(`dbgate.${DOMAIN}`)"
      - "traefik.http.routers.dbgate.entrypoints=websecure"
      - "traefik.http.routers.dbgate.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dbgate.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.dbgate.loadbalancer.server.port=3000"

  firefox:
    container_name: firefox
    image: jlesage/firefox
    volumes:
      - firefox:/config
    networks:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true" 
      - "traefik.http.routers.firefox.rule=Host(`firefox.${DOMAIN}`)"
      - "traefik.http.routers.firefox.entrypoints=websecure"
      - "traefik.http.routers.firefox.tls.certresolver=letsencrypt"
      - "traefik.http.routers.firefox.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.firefox.middlewares=authentik@file"
      - "traefik.http.services.firefox.loadbalancer.server.port=5800"

  it-tools: # https://github.com/CorentinTh/it-tools
    container_name: it-tools
    image: ghcr.io/corentinth/it-tools:latest
    networks:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`tools.${DOMAIN}`)"
      - "traefik.http.routers.it-tools.entrypoints=websecure"
      - "traefik.http.routers.it-tools.tls.certresolver=letsencrypt"
      - "traefik.http.routers.it-tools.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.it-tools.loadbalancer.server.port=80"
  
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    networks:
      - backend
      - web
    volumes:
      - pgadmin:/pgadmin4
      - pgadmin:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pgadmin.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"    

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    hostname: mariadb.${DOMAIN}
    networks:
      - backend
      - web
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
    volumes:
      - phpmyadmin:/etc/phpmyadmin
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`mariadb.${DOMAIN}`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=websecure"
      - "traefik.http.routers.phpmyadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.phpmyadmin.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.phpmyadmin.middlewares=authentik@file"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
    

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - cache
    command: >
      redis-server
      --save ""
      --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    volumes:
      - termix:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.termix.rule=Host(`termix.${DOMAIN}`)"
      - "traefik.http.routers.termix.entrypoints=websecure"
      - "traefik.http.routers.termix.tls.certresolver=letsencrypt"
      - "traefik.http.routers.termix.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.termix.loadbalancer.server.port=8080"

networks:
  cache:
    external: true
  web:
    external: true
  backend:
    external: true

volumes:
  code-server:
    external: true
  dbgate:
    external: true
  firefox:
    external: true
  pgadmin:
    external: true
  phpmyadmin:
    external: true
  termix:
    external: true