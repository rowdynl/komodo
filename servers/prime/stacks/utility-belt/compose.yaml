# Batman has gadgets. You have this. A collection of tools you didn’t know you needed until 
# exactly five seconds before reaching for them. Firefox handles your browsing heroics, code‑server 
# turns any machine into your personal bat‑cave IDE, and IT‑Tools supplies every random 
# utility that saves your day at 3 AM. It’s not a stack — it’s your “because I can” toolkit.
name: utility-belt

services:
  bentopdf:
    # simple mode - ghcr.io/alam00000/bentopdf-simple:latest
    # default mode - ghcr.io/alam00000/bentopdf:latest
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    networks: 
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=BentoPDF
      - flame.url=https://bentopdf.${DOMAIN}
      - flame.icon=file-pdf-box
      - traefik.enable=true
      - traefik.http.routers.bentopdf.rule=Host(`bentopdf.${DOMAIN}`)
      - traefik.http.routers.bentopdf.entrypoints=websecure
      - traefik.http.routers.bentopdf.tls.certresolver=letsencrypt
      - traefik.http.routers.bentopdf.priority=${TRAEFIK_PRIORITY}
      #- traefik.http.routers.bentopdf.middlewares=crowdsec@file,geoblock@file,authentik@file
      - traefik.http.services.bentopdf.loadbalancer.server.port=8080

  bytestash:
    image: ghcr.io/jordan-dalby/bytestash:latest
    container_name: bytestash
    volumes:
      - bytestash:/data/snippets
    restart: unless-stopped
    user: ${PUID}:${PGID}
    env_file: ./env/bytestash.env      
    networks:
      - web
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=ByteStash
      - flame.url=https://bytestash.${DOMAIN}
      - flame.icon=code-block-braces
      - traefik.enable=true
      - traefik.http.routers.bytestash.entrypoints=websecure
      - traefik.http.routers.bytestash.middlewares=umami@file
      - traefik.http.routers.bytestash.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.bytestash.rule=Host(`bytestash.${DOMAIN}`)
      - traefik.http.routers.bytestash.tls.certresolver=letsencrypt
      - traefik.http.services.bytestash.loadbalancer.server.port=5000

  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    networks:
      - backend
      - web
    environment:
      - DEFAULT_WORKSPACE=/config/workspace
      - LANGUAGE=en_US.UTF-8
      - LANG=en_US.UTF-8
      - PUID=${PUID}
      - PGID=${PGID}
      - S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0
      - S6_VERBOSITY=1
      - S6_STAGE2_HOOK=/docker-mods
      - TZ=${TZ}
      - EXTENSIONS_GALLERY={"serviceUrl":"https://marketplace.visualstudio.com/_apis/public/gallery","cacheUrl":"https://vscode.blob.core.windows.net/gallery/index","itemUrl":"https://marketplace.visualstudio.com/items"}
    volumes:
      - code-server:/config
      - /repos/komodo:/config/workspace/repos/komodo
      - /mnt/prime-ds/docker/hass/config:/config/workspace/home-assistant-prime-ds
      - /mnt/docker/volumes/esphome:/config/workspace/repos/esphome
      - /mnt/docker/volumes/home-assistant:/config/workspace/home-assistant
      - /mnt/docker/volumes/traefik:/config/workspace/traefik
    restart: unless-stopped
    mem_limit: 1152m    
    cpus: 1
    security_opt:
      - label=disable
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=code-server
      - flame.url=https://code-server.${DOMAIN}
      - flame.icon=code-braces
      - traefik.enable=true
      - traefik.http.routers.code-server.rule=Host(`code-server.${DOMAIN}`)
      - traefik.http.routers.code-server.entrypoints=websecure
      - traefik.http.routers.code-server.tls.certresolver=letsencrypt
      - traefik.http.routers.code-server.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.code-server.middlewares=authentik@file
      - traefik.http.services.code-server.loadbalancer.server.port=8443
  
  dbgate:
    container_name: dbgate
    image: dbgate/dbgate
    networks:
      - backend
      - cache
      - web
    volumes:
      - dbgate:/root/.dbgate
    environment:
      - OAUTH_AUTH=https://auth.${DOMAIN}/application/o/authorize/
      - OAUTH_TOKEN=https://auth.${DOMAIN}/application/o/token/
      - OAUTH_LOGOUT=https://auth.${DOMAIN}/application/o/dbgate/end-session/
      - OAUTH_CLIENT_ID=${DBGATE_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${DBGATE_OAUTH_CLIENT_SECRET}
      - OAUTH_LOGIN_FIELD=email
      - OAUTH_SCOPE=openid email profile
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Databases
      - flame.name=DBGate
      - flame.url=https://dbgate.${DOMAIN}
      - flame.icon=database-cog-outline
      - traefik.enable=true
      - traefik.http.routers.dbgate.rule=Host(`dbgate.${DOMAIN}`)
      - traefik.http.routers.dbgate.entrypoints=websecure
      - traefik.http.routers.dbgate.tls.certresolver=letsencrypt
      - traefik.http.routers.dbgate.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.dbgate.middlewares=authentik@file
      - traefik.http.services.dbgate.loadbalancer.server.port=3000

  firefox:
    container_name: firefox
    image: jlesage/firefox
    volumes:
      - firefox:/config
    networks:
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=Firefox
      - flame.url=https://firefox.${DOMAIN}
      - flame.icon=firefox
      - traefik.enable=true
      - traefik.http.routers.firefox.rule=Host(`firefox.${DOMAIN}`)
      - traefik.http.routers.firefox.entrypoints=websecure
      - traefik.http.routers.firefox.tls.certresolver=letsencrypt
      - traefik.http.routers.firefox.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.firefox.middlewares=authentik@file
      - traefik.http.services.firefox.loadbalancer.server.port=5800

  it-tools: # https://github.com/CorentinTh/it-tools
    container_name: it-tools
    image: ghcr.io/corentinth/it-tools:latest
    networks:
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=IT Tools
      - flame.url=https://tools.${DOMAIN}
      - flame.icon=tools
      - traefik.enable=true
      - traefik.http.routers.it-tools.entrypoints=websecure
      - traefik.http.routers.it-tools.middlewares=umami@file
      - traefik.http.routers.it-tools.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.it-tools.rule=Host(`tools.${DOMAIN}`)
      - traefik.http.routers.it-tools.tls.certresolver=letsencrypt      
      - traefik.http.services.it-tools.loadbalancer.server.port=80 

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - web
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}      
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=Grafana
      - flame.url=https://grafana.${DOMAIN}
      - flame.icon=chart-line
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.grafana.middlewares=authentik@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  nextexplorer:
    image: nxzai/explorer:latest
    container_name: nextexplorer
    restart: unless-stopped
    volumes:
      - nextexplorer:/config
      # Each /mnt/<Label> mount becomes a top-level volume in the UI
      - /mnt/docker/volumes:/mnt/docker-volumes
      - /repos:/mnt/repos
      - icloud:/mnt/icloud
    networks:
      - web
    env_file: 
      - ../../../global.env
      - ./env/nextexplorer.env
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=NextExplorer
      - flame.url=https://explorer.${DOMAIN}
      - flame.icon=file-search-outline
      - traefik.enable=true
      - traefik.http.routers.nextexplorer.rule=Host(`explorer.${DOMAIN}`)
      - traefik.http.routers.nextexplorer.entrypoints=websecure
      - traefik.http.routers.nextexplorer.tls.certresolver=letsencrypt
      - traefik.http.routers.nextexplorer.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.nextexplorer.loadbalancer.server.port=3000
      

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - cache
    command: >
      redis-server
      --save ""
      --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scanopy-daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    env_file:
      - ./env/scanopy.env
    volumes:
      - type: volume
        source: scanopy
        target: /root/.config/daemon
        volume:
          subpath: daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    
  scanopy-server:
    image: ghcr.io/scanopy/scanopy/server:latest
    ports:
      - 60072:60072
    env_file:
      - ./env/scanopy.env
    volumes:
      - type: volume
        source: scanopy
        target: /data
        volume:
          subpath: data      
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - backend
      - web
    labels:
      - flame.type=application
      - flame.name=Scanopy
      - flame.category=Utility Belt
      - flame.url=https://scanopy.${DOMAIN}
      - flame.icon=server-network-outline
      - traefik.enable=true
      - traefik.http.routers.scanopy.rule=Host(`scanopy.${DOMAIN}`)
      - traefik.http.routers.scanopy.entrypoints=websecure
      - traefik.http.routers.scanopy.tls.certresolver=letsencrypt
      - traefik.http.routers.scanopy.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.scanopy.middlewares=authentik@file
      - traefik.http.services.scanopy.loadbalancer.server.port=60072

  
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    volumes:
      - termix:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Termix
      - flame.category=Utility Belt
      - flame.url=https://termix.${DOMAIN}
      - flame.icon=console
      - traefik.enable=true
      - traefik.http.routers.termix.rule=Host(`termix.${DOMAIN}`)
      - traefik.http.routers.termix.entrypoints=websecure
      - traefik.http.routers.termix.tls.certresolver=letsencrypt
      - traefik.http.routers.termix.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.termix.middlewares=authentik@file
      - traefik.http.services.termix.loadbalancer.server.port=8080

networks:
  cache:
    external: true
  web:
    external: true
  backend:
    external: true

volumes:
  bytestash:
    external: true
  code-server:
    external: true
  dbgate:
    external: true
  firefox:
    external: true
  grafana:
    external: true
  nextexplorer:
    external: true
  pgadmin:
    external: true
  phpmyadmin:
    external: true
  scanopy:
    external: true
  termix:
    external: true
  
  # Mounts from other stacks to be used with NextExplorer
  icloud:
    external: true