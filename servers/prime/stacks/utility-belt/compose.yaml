# Batman has gadgets. You have this. A collection of tools you didn’t know you needed until 
# exactly five seconds before reaching for them. Firefox handles your browsing heroics, code‑server 
# turns any machine into your personal bat‑cave IDE, and IT‑Tools supplies every random 
# utility that saves your day at 3 AM. It’s not a stack — it’s your “because I can” toolkit.
name: utility-belt

services:
  bentopdf:
    # simple mode - ghcr.io/alam00000/bentopdf-simple:latest
    # default mode - ghcr.io/alam00000/bentopdf:latest
    image: ghcr.io/alam00000/bentopdf-simple:latest
    container_name: bentopdf
    networks: 
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=BentoPDF
      - flame.url=https://pdf.${DOMAIN}
      - flame.icon=file-pdf-box
      - traefik.enable=true
      - traefik.http.routers.bentopdf.rule=Host(`pdf.${DOMAIN}`)
      - traefik.http.routers.bentopdf.entrypoints=websecure
      - traefik.http.routers.bentopdf.tls.certresolver=letsencrypt
      - traefik.http.routers.bentopdf.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.bentopdf.middlewares=umami@file
      - traefik.http.services.bentopdf.loadbalancer.server.port=8080

  dbgate:
    container_name: dbgate
    image: dbgate/dbgate
    networks:
      - backend
      - cache
      - web
    volumes:
      - dbgate:/root/.dbgate
    environment:
      - OAUTH_AUTH=https://auth.${DOMAIN}/application/o/authorize/
      - OAUTH_TOKEN=https://auth.${DOMAIN}/application/o/token/
      - OAUTH_LOGOUT=https://auth.${DOMAIN}/application/o/dbgate/end-session/
      - OAUTH_CLIENT_ID=${DBGATE_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${DBGATE_OAUTH_CLIENT_SECRET}
      - OAUTH_LOGIN_FIELD=email
      - OAUTH_SCOPE=openid email profile
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Databases
      - flame.name=DBGate
      - flame.url=https://dbgate.${DOMAIN}
      - flame.icon=database-cog-outline
      - traefik.enable=true
      - traefik.http.routers.dbgate.rule=Host(`dbgate.${DOMAIN}`)
      - traefik.http.routers.dbgate.entrypoints=websecure
      - traefik.http.routers.dbgate.tls.certresolver=letsencrypt
      - traefik.http.routers.dbgate.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.dbgate.middlewares=oidc-auth@file
      - traefik.http.services.dbgate.loadbalancer.server.port=3000

  firefox:
    container_name: firefox
    image: jlesage/firefox
    volumes:
      - firefox:/config
    networks:
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=Firefox
      - flame.url=https://firefox.${DOMAIN}
      - flame.icon=firefox
      - traefik.enable=true
      - traefik.http.routers.firefox.rule=Host(`firefox.${DOMAIN}`)
      - traefik.http.routers.firefox.entrypoints=websecure
      - traefik.http.routers.firefox.tls.certresolver=letsencrypt
      - traefik.http.routers.firefox.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.firefox.middlewares=oidc-auth@file
      - traefik.http.services.firefox.loadbalancer.server.port=5800

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - web
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}      
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.${DOMAIN}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=Grafana
      - flame.url=https://grafana.${DOMAIN}
      - flame.icon=chart-line
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.grafana.middlewares=oidc-auth@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  isponsorblocktv:
    image: ghcr.io/dmunozv04/isponsorblocktv
    container_name: isponsorblocktv
    restart: unless-stopped
    network_mode: host
    volumes:
      - isponsorblocktv:/app/data #enter the same pathway as you used for your configurator in step 1

  nextexplorer:
    image: nxzai/explorer:latest
    container_name: nextexplorer
    restart: unless-stopped
    volumes:
      - nextexplorer:/config
      # Each /mnt/<Label> mount becomes a top-level volume in the UI
      - /mnt/docker/volumes:/mnt/docker-volumes
      - /repos:/mnt/repos
      - icloud:/mnt/icloud
      - paperless:/mnt/paperless
      - web-venlosevrind.nl:/mnt/web-venlosevrind
    networks:
      - web
    env_file: 
      - ../../../global.env
      - ./env/nextexplorer.env
    labels:
      - flame.type=application
      - flame.category=Utility Belt
      - flame.name=NextExplorer
      - flame.url=https://explorer.${DOMAIN}
      - flame.icon=file-search-outline
      - traefik.enable=true
      - traefik.http.routers.nextexplorer.rule=Host(`explorer.${DOMAIN}`)
      - traefik.http.routers.nextexplorer.entrypoints=websecure
      - traefik.http.routers.nextexplorer.tls.certresolver=letsencrypt
      - traefik.http.routers.nextexplorer.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.nextexplorer.loadbalancer.server.port=3000     

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - cache
    command: >
      redis-server
      --save ""
      --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    env_file: 
      - ../../../global.env
      - ./env/termix.env
    volumes:
      - termix:/app/data
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - web
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Termix
      - flame.category=Utility Belt
      - flame.url=https://termix.${DOMAIN}
      - flame.icon=console
      - traefik.enable=true
      - traefik.http.routers.termix.rule=Host(`termix.${DOMAIN}`)
      - traefik.http.routers.termix.entrypoints=websecure
      - traefik.http.routers.termix.tls.certresolver=letsencrypt
      - traefik.http.routers.termix.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.termix.loadbalancer.server.port=8080

  tududi:
    image: chrisvel/tududi:1.1.0-dev.14
    container_name: tududi
    env_file:
      - ../../../global.env
      - ./env/tududi.env
    networks:
      - web     
    volumes:
      - tududi-db:/app/backend/db
      - tududi-uploads:/app/backend/uploads
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Tududi
      - flame.category=Utility Belt
      - flame.url=https://tududi.${DOMAIN}
      - flame.icon=file-document-edit-outline
      - traefik.enable=true
      - traefik.http.routers.tududi.rule=Host(`tududi.${DOMAIN}`)
      - traefik.http.routers.tududi.entrypoints=websecure
      - traefik.http.routers.tududi.tls.certresolver=letsencrypt
      - traefik.http.routers.tududi.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.tududi.middlewares=umami@file
      - traefik.http.services.tududi.loadbalancer.server.port=3002
  


networks:
  cache:
    external: true
  web:
    external: true
  backend:
    external: true

volumes:
  dbgate:
    external: true
  firefox:
    external: true
  grafana:
    external: true
  isponsorblocktv:
    external: true
  nextexplorer:
    external: true
  pgadmin:
    external: true
  phpmyadmin:
    external: true
  termix:
    external: true
  tududi-db:
    external: true
  tududi-uploads:
    external: true
  
  # Mounts from other stacks to be used with NextExplorer
  icloud:
    external: true
  paperless:
    external: true
  web-venlosevrind.nl:
    external: true