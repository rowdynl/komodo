global:
  scrape_interval: 15s
  evaluation_interval: 15s

external_labels:
  site: "prime"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Host metrics (CPU/RAM/disk/net)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Docker/container metrics
  - job_name: "cadvisor"
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  # Traefik metrics (needs Traefik metrics enabled; see notes below)
  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]
    metrics_path: /metrics