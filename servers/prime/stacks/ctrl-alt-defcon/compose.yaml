# Monitors everything and escalates threats immediately… even if it’s just a slightly warm HDD.
name: ctrl-alt-defcon

services:
  
  glances:
    image: nicolargo/glances:ubuntu-latest-full
    container_name: glances
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    environment:
      GLANCES_OPT: -w --enable-mcp -C /etc/glances/glances.conf
    volumes:
      - glances:/etc/glances
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /etc/hostname:/etc/hostname:ro
      - /etc/localtime:/etc/localtime:ro
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      - /:/rootfs:ro
    labels:
      - flame.type=application
      - flame.name=Glances
      - flame.url=https://glances.${DOMAIN}
      - flame.icon=chart-line
      - flame.category=CTRL ALT DEFCON
      - traefik.enable=true
      - traefik.http.routers.glances.rule=Host(`glances.${DOMAIN}`)
      - traefik.http.routers.glances.entrypoints=websecure
      - traefik.http.routers.glances.tls=true
      - traefik.http.routers.glances.middlewares=oidc-auth@file
      - traefik.http.routers.glances.service=glances      
      - traefik.http.routers.glances-oidc.rule=Host(`glances.${DOMAIN}`) && PathPrefix(`/oidc`)
      - traefik.http.routers.glances-oidc.entrypoints=websecure
      - traefik.http.routers.glances-oidc.middlewares=oidc-auth@file
      - traefik.http.routers.glances-oidc.service=glances
      - traefik.http.services.glances.loadbalancer.server.port=61208

  godns:
    container_name: godns
    image: timothyye/godns:latest
    networks:
      - web
    environment:
      - CONFIG=/config/config.json
    restart: unless-stopped
    user: ${PUID}:${PGID}
    volumes:
      - godns:/config/
    labels:
      - flame.type=application
      - flame.category=CTRL ALT DEFCON
      - flame.name=GoDNS
      - flame.url=https://godns.${DOMAIN}
      - flame.icon=dns-outline
      - traefik.enable=true
      - traefik.http.routers.godns.rule=Host(`godns.${DOMAIN}`)
      - traefik.http.routers.godns.entrypoints=websecure
      - traefik.http.routers.godns.tls.certresolver=letsencrypt
      - traefik.http.routers.godns.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.godns.middlewares=oidc-auth@file
      - traefik.http.services.godns.loadbalancer.server.port=9099
  
  scrutiny-web:
    image: 'ghcr.io/analogj/scrutiny:master-web'
    container_name: scrutiny-web
    ports:
      - 8582:8080
    volumes:
      - scrutiny:/opt/scrutiny/config
    networks:
      - backend
      - web
    restart: unless-stopped    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    labels:
      - flame.type=application
      - flame.category=CTRL ALT DEFCON
      - flame.name=Scrutiny
      - flame.url=https://scrutiny.${DOMAIN}
      - flame.icon=harddisk
      - traefik.enable=true
      - traefik.http.routers.scrutiny.rule=Host(`scrutiny.${DOMAIN}`)
      - traefik.http.routers.scrutiny.entrypoints=websecure
      - traefik.http.routers.scrutiny.tls.certresolver=letsencrypt
      - traefik.http.routers.scrutiny.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.scrutiny.middlewares=oidc-auth@file
      - traefik.http.services.scrutiny.loadbalancer.server.port=8080

  speedtest-tracker:
    image: ghcr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    networks:
      - backend
      - web
    env_file:
      - ../../../global.env
      - ./env/speedtest-tracker.env
    restart: unless-stopped
    ports:
      - 8033:80
    volumes:
      - speedtest-tracker:/config
    labels:
      - flame.type=application
      - flame.category=CTRL ALT DEFCON
      - flame.name=Speedtest Tracker
      - flame.url=https://speedtest.${DOMAIN}
      - flame.icon=speedometer
      - traefik.enable=true
      - traefik.http.routers.speedtest-tracker.rule=Host(`speedtest.${DOMAIN}`)
      - traefik.http.routers.speedtest-tracker.entrypoints=websecure
      - traefik.http.routers.speedtest-tracker.tls.certresolver=letsencrypt
      - traefik.http.routers.speedtest-tracker.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.speedtest-tracker.middlewares=oidc-auth@file
      - traefik.http.services.speedtest-tracker.loadbalancer.server.port=80
  
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    networks:
      - backend
      - cache
      - web
    volumes:
      - uptime-kuma:/app/data
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=CTRL ALT DEFCON
      - flame.name=Uptime Kuma
      - flame.url=https://kuma.${DOMAIN}
      - flame.icon=clock-outline
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`kuma.${DOMAIN}`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=letsencrypt
      - traefik.http.routers.kuma.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.kuma.middlewares=oidc-auth@file
      - traefik.http.services.kuma.loadbalancer.server.port=3001

networks:
  backend:
    external: true
  cache:
    external: true
  web:
    external: true

volumes:
  glances:
    external: true
  godns:
    external: true
  scrutiny:
    external: true
  speedtest-tracker:
    external: true
  uptime-kuma:
    external: true