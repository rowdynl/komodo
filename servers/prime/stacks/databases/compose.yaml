networks:
  backend:
    external: true
  web:
    external: true

volumes:
  authentik-postgresql:
    external: true
  influxdb-config:
    external: true
  influxdb-data:
    external: true
  mariadb:
    external: true
  mongodb:
    external: true
  postgresql:  
    external: true