name: databases

services:
  influxdb:
    image: docker.io/influxdb:latest
    container_name: influxdb
    network:
      backend:
      web:      
    volumes:
      - influxdb-config:/etc/influxdb2
      - influxdb-data:/var/lib/influxdb2
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 11s
      timeout: 11s
      retries: 22
