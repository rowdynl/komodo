# Your digital border checkpoint, complete with grumpy guards and deep suspicion of anything passing
# through. Traefik directs traffic like an overly caffeinated air‑traffic controller, Authentik checks 
# IDs with military precision, Pi‑hole blocks shady tourists, CrowdSec cracks down on hooligans, 
# and WireGuard handles diplomatic transport. Welcome to the fortress — passport, please.
name: border-control

services:
  authentik-server:
    image: ghcr.io/goauthentik/server:2025.12.4
    container_name: authentik-server
    command: server
    networks:
      - cache
      - backend
      - web
    env_file:
      - ./env/authentik.env      
    volumes:
      - type: volume
        source: authentik
        target: /certs
        volume:
          subpath: certs
      - type: volume
        source: authentik
        target: /data
        volume:
          subpath: data
      - type: volume
        source: authentik
        target: /templates
        volume:
          subpath: custom-templates      
    restart: unless-stopped    
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)"
    - "traefik.http.routers.authentik.entrypoints=websecure"
    - "traefik.http.routers.authentik.tls=true"
    - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
    - "traefik.http.routers.authentik.priority=${TRAEFIK_PRIORITY}"
    - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    - "traefik.http.services.authentik.loadbalancer.passhostheader=true"


  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.12.4
    container_name: authentik-worker
    command: worker
    networks:
      - cache
      - backend
    env_file:
      - ./env/authentik.env
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: volume
        source: authentik
        target: /certs
        volume:
          subpath: certs
      - type: volume
        source: authentik
        target: /data
        volume:
          subpath: data
      - type: volume
        source: authentik
        target: /templates
        volume:
          subpath: custom-templates      
    restart: unless-stopped
    
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    env_file:
      - ./env/crowdsec.env
    volumes:
      - traefik:/var/log/traefik:ro
      - crowdsec:/etc/crowdsec/
    tmpfs:
      - /var/lib/crowdsec/data:rw,size=512m
    depends_on:
      - traefik
    networks:
      - web
    restart: unless-stopped

  krawl:
    image: ghcr.io/blessedrebus/krawl:latest
    container_name: krawl
    env_file:
      - ./env/krawl.env
    networks:
      - web
    volumes:
      - krawl:/app/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # Explicit host (normal Krawl dashboard)
      - "traefik.http.routers.krawl.rule=Host(`krawl.${DOMAIN}`)"
      - "traefik.http.routers.krawl.entrypoints=websecure"
      - "traefik.http.routers.krawl.tls=true"
      - "traefik.http.routers.krawl.tls.certresolver=letsencrypt"
      - "traefik.http.routers.krawl.priority=${TRAEFIK_PRIORITY}"

      # SILENT catch‑all for unknown subdomains
      - "traefik.http.routers.krawl-fallback.rule=HostRegexp(`{subdomain:.+}.tcit.nl`)"
      - "traefik.http.routers.krawl-fallback.entrypoints=websecure"
      - "traefik.http.routers.krawl-fallback.tls=true"
      - "traefik.http.routers.krawl-fallback.tls.certresolver=letsencrypt"
      - "traefik.http.routers.krawl-fallback.priority=1"
      - "traefik.http.routers.krawl-fallback.service=krawl"

      # Service port
      - "traefik.http.services.krawl.loadbalancer.server.port=5000"

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    networks:
      - web
    env_file:
      - ./env/pihole.env      
    volumes:
      - pihole:/etc/pihole     
    cap_add:   
      - NET_ADMIN
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pihole.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.pihole.middlewares=authentik@file"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      
  traefik:
    image: traefik:latest
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    ports:
      - 80:80
      - 443:443    
    env_file:
      - ./env/traefik.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik:/etc/traefik   # static & dynamic config live here
      - traefik:/data          # acme.json will be created/managed here
    restart: unless-stopped
      
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wireguard
    env_file:
      - ./env/wireguard.env
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
      - 51821:51821
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - web
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped
    labels:
      - "komodo.skip=true"
      - "traefik.enable=true"
      - "traefik.http.routers.wireguard.rule=Host(`wireguard.${DOMAIN}`)"
      - "traefik.http.routers.wireguard.entrypoints=websecure"
      - "traefik.http.routers.wireguard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wireguard.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.wireguard.middlewares=authentik@file"
      - "traefik.http.services.wireguard.loadbalancer.server.port=51821"


networks:
  cache:
    external: true
  backend:
    external: true
  web:
    external: true

volumes:
  authentik:
    external: true
  authentik-certs:
    external: true
  authentik-custom-templates:
    external: true
  authentik-data:
    external: true
  crowdsec:
    external: true
  krawl:
    external: true
  pihole:
    external: true
  traefik:
    external: true
  wireguard:
    external: true
