# Your digital border checkpoint, complete with grumpy guards and deep suspicion of anything passing
# through. Traefik directs traffic like an overly caffeinated air‑traffic controller, Authentik checks 
# IDs with military precision, Pi‑hole blocks shady tourists, CrowdSec cracks down on hooligans, 
# and WireGuard handles diplomatic transport. Welcome to the fortress — passport, please.
name: border-control

services:
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    env_file: ./env/crowdsec.env
    volumes:
      - traefik:/var/log/traefik:ro
      - crowdsec:/etc/crowdsec/
    tmpfs:
      - /var/lib/crowdsec/data:rw,size=512m
    depends_on:
      - traefik
    networks:
      - web
    restart: unless-stopped

  flame:
    image: ghcr.io/fdarveau/flame:latest
    container_name: flame
    env_file: ./env/flame.env
    group_add:
      - 988
    volumes:
      - flame:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 5005:5005
    restart: unless-stopped
    networks:
      - web
    labels:
    - traefik.enable=true
    - traefik.http.routers.flame.rule=Host(`${DOMAIN}`)
    - traefik.http.routers.flame.entrypoints=websecure
    - traefik.http.routers.flame.tls=true
    - traefik.http.routers.flame.tls.certresolver=letsencrypt
    - traefik.http.routers.flame.priority=${TRAEFIK_PRIORITY}
    - traefik.http.routers.flame.middlewares=oidc-auth@file
    - traefik.http.services.flame.loadbalancer.server.port=5005

  krawl:
    image: ghcr.io/blessedrebus/krawl:latest
    container_name: krawl
    env_file: ./env/krawl.env
    networks:
      - web
    volumes:
      - krawl:/app/data
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Krawl
      - flame.category=Border Control
      - flame.url=https://krawl.${DOMAIN}${KRAWL_DASHBOARD_SECRET_PATH}
      - flame.icon=spider-outline
      - traefik.enable=true
      - traefik.http.routers.krawl.rule=Host(`krawl.${DOMAIN}`)
      - traefik.http.routers.krawl.entrypoints=websecure
      - traefik.http.routers.krawl.tls=true
      - traefik.http.routers.krawl.tls.certresolver=letsencrypt
      - traefik.http.routers.krawl.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.krawl.loadbalancer.server.port=5000
      - traefik.http.routers.krawl-fallback.rule=HostRegexp(`{subdomain:.+}.tcit.nl`)
      - traefik.http.routers.krawl-fallback.entrypoints=websecure
      - traefik.http.routers.krawl-fallback.tls=true
      - traefik.http.routers.krawl-fallback.tls.certresolver=letsencrypt
      - traefik.http.routers.krawl-fallback.priority=1
      - traefik.http.routers.krawl-fallback.service=krawl


  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole.${DOMAIN}
    networks:
      - web
    env_file: ./env/pihole.env
    volumes:
      - pihole:/etc/pihole
      - /etc/hostname:/etc/hostname:ro
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Pi-hole
      - flame.category=Border Control
      - flame.url=https://pihole.${DOMAIN}/admin
      - flame.icon=shield-outline
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)
      - traefik.http.routers.pihole.entrypoints=websecure
      - traefik.http.routers.pihole.tls.certresolver=letsencrypt
      - traefik.http.routers.pihole.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.pihole.middlewares=oidc-auth-pihole@file
      - traefik.http.services.pihole.loadbalancer.server.port=80
  
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: pocket-id
    restart: unless-stopped
    env_file:
      - ../../../global.env
      - ./env/pocket-id.env
    networks:
      - backend
      - web
    volumes:
      - pocket-id:/app/data
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    labels:
      - flame.type=application
      - flame.name=Pocket-ID
      - flame.category=Border Control
      - flame.url=${OIDC_BASE_URL}
      - flame.icon=key-chain
      - traefik.enable=true
      - traefik.http.routers.pocket-id.rule=Host(`id.${DOMAIN}`)
      - traefik.http.routers.pocket-id.entrypoints=websecure
      - traefik.http.routers.pocket-id.tls=true
      - traefik.http.routers.pocket-id.tls.certresolver=letsencrypt
      - traefik.http.routers.pocket-id.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.pocket-id.loadbalancer.server.port=1411
      - traefik.http.services.pocket-id.loadbalancer.passhostheader=true

  traefik:
    image: traefik:latest
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    ports:
      - 80:80
      - 443:443    
    env_file: ./env/traefik.env    
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik:/etc/traefik
      - traefik:/data
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.name=Traefik
      - flame.category=Border Control
      - flame.url=https://traefik.${DOMAIN}
      - flame.icon=routes


  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file: ./env/vaultwarden.env      
    volumes:
      - vaultwarden:/data/
    networks:
      - web
    labels:
      - flame.type=application
      - flame.name=Vaultwarden
      - flame.category=Border Control
      - flame.url=https://vault.${DOMAIN}
      - flame.icon=shield-lock-outline
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt
      - traefik.http.routers.vaultwarden.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
      
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wireguard
    env_file: ./env/wireguard.env
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - web
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped
    labels:
      - komodo.skip=true
      - flame.type=application
      - flame.name=WireGuard
      - flame.category=Border Control
      - flame.url=https://wireguard.${DOMAIN}
      - flame.icon=vpn
      - traefik.enable=true
      - traefik.http.routers.wireguard.rule=Host(`wireguard.${DOMAIN}`)
      - traefik.http.routers.wireguard.entrypoints=websecure
      - traefik.http.routers.wireguard.tls.certresolver=letsencrypt
      - traefik.http.routers.wireguard.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.wireguard.middlewares=oidc-auth-wireguard@file
      - traefik.http.services.wireguard.loadbalancer.server.port=51821


networks:
  cache:
    external: true
  backend:
    external: true
  web:
    external: true

volumes:
  authentik-certs:
    external: true
  authentik-data:
    external: true
  authentik-templates:
    external: true
  crowdsec:
    external: true
  flame:
    external: true
  krawl:
    external: true
  pihole:
    external: true
  pocket-id:
    external: true
  traefik:
    external: true
  vaultwarden:
    external: true
  wireguard:
    external: true
