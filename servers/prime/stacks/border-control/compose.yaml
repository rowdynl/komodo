#Your digital border checkpoint, complete with grumpy guards and deep suspicion of anything passing
# through. Traefik directs traffic like an overly caffeinated air‑traffic controller, Authentik checks 
# IDs with military precision, Pi‑hole blocks shady tourists, CrowdSec cracks down on hooligans, 
# and WireGuard handles diplomatic transport. Welcome to the fortress — passport, please.
name: border-control

services:
  authentik-server:
    image: ghcr.io/goauthentik/server
    container_name: authentik-server
    command: server
    networks:
      - cache
      - backend
      - web
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${AUTHENTIK_PG_HOST}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}    
    volumes:
      - authentik-data:/data
      - authentik-custom-templates:/templates 
    restart: unless-stopped    
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)"
    - "traefik.http.routers.authentik.entrypoints=websecure"
    - "traefik.http.routers.authentik.tls=true"
    - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
    - "traefik.http.routers.authentik.priority=${TRAEFIK_PRIORITY}"
    - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    - "traefik.http.services.authentik.loadbalancer.passhostheader=true"


  authentik-worker:
    image: ghcr.io/goauthentik/server
    container_name: authentik-worker
    command: worker
    networks:
      - cache
      - backend
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${AUTHENTIK_PG_HOST}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_PG_DB}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_PG_USER}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}    
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik-data:/data
      - authentik-certs:/certs
      - authentik-custom-templates:/templates 
    restart: unless-stopped
    
  crowdsec:
    image: crowdsecurity/crowdsec
    container_name: crowdsec
    environment:
      - GID=${PGID}
      - UID=${PUID}
      - TZ=${TZ}
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/http-dos
    volumes:
      - traefik:/var/log/traefik:ro
      - crowdsec:/etc/crowdsec/
    tmpfs:
      - /var/lib/crowdsec/data:rw,size=512m
    depends_on:
      - traefik
    networks:
      - web
    restart: unless-stopped

  krawl:
    image: ghcr.io/blessedrebus/krawl:latest
    container_name: krawl
    environment:
      - KRAWL_DASHBOARD_SECRET_PATH=${KRAWL_DASHBOARD_SECRET_PATH}
      - TZ=${TZ}
    networks:
      - web
    volumes:
      - krawl:/app/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

      # Normal explicit route
      - "traefik.http.routers.krawl.rule=Host(`krawl.${DOMAIN}`)"
      - "traefik.http.routers.krawl.entrypoints=websecure"
      - "traefik.http.routers.krawl.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.krawl.tls=true"

      # Catch-all honeypot route
      - "traefik.http.routers.krawl-fallback.rule=HostRegexp(`{any:.*}`)"
      - "traefik.http.routers.krawl-fallback.entrypoints=web,websecure"
      - "traefik.http.routers.krawl-fallback.priority=-11"

      # Service port
      - "traefik.http.services.krawl.loadbalancer.server.port=5000"

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    networks:
      - web
    #ports:      
    #  - 53:53/tcp    # DNS port
    #  - 53:53/udp    # DNS port
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_ADMIN_PASSWORD}
      - FTLCONF_dns_listeningMode=all
      - DNSMASQ_USER=root
      - PIHOLE_UID=${PUID}
      - PIHOLE_GID=${PGID}      
    volumes:
      - pihole:/etc/pihole     
    cap_add:   
      - NET_ADMIN
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pihole.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      
  traefik:
    image: traefik:latest
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik:/etc/traefik   # static & dynamic config live here
      - traefik:/data          # acme.json will be created/managed here
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wireguard
    environment:
      - WG_ALLOWED_IPS=${WIREGUARD_ALLOWED_IPS}
      - WG_HOST=${WIREGUARD_HOST}
      - PASSWORD_HASH=${WIREGUARD_PASSWORD_HASH}
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
      - 51821:51821
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - web
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    restart: unless-stopped
    labels:
      - "komodo.skip=true"
      - "traefik.enable=true"
      - "traefik.http.routers.wireguard.rule=Host(`wireguard.${DOMAIN}`)"
      - "traefik.http.routers.wireguard.entrypoints=websecure"
      - "traefik.http.routers.wireguard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wireguard.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.wireguard.loadbalancer.server.port=51821"


networks:
  backend:
    external: true
  web:
    external: true

volumes:
  authentik-certs:
    external: true
  authentik-custom-templates:
    external: true
  authentik-data:
    external: true
  crowdsec:
    external: true
  krawl:
    external: true
  pihole:
    external: true
  traefik:
    external: true
  wireguard:
    external: true
