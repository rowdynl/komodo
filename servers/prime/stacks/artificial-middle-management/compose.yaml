# Giving AI access to tools so it can delegate even harder.

name: artificial-middle-management

services:
  ha-mcp-screenshot:
    image: ha-mcp-screenshot:latest
    container_name: ha-mcp-screenshot
    pull_policy: build
    build:
      context: ./home-assistant-addons/puppet
      dockerfile: Dockerfile    
    env_file: ./env/ha-mcp-screenshot.env
    networks:
      - mcp
    restart: unless-stopped

networks:
  mcp:
    external: true