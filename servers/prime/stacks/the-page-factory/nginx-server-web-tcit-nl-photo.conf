server {
    listen 8080;
    listen [::]:8080;

    # Use your real hostname to avoid "conflicting server name _" warnings
    # (change to whatever host you route to this container)
    server_name photo.tcit.nl;

    root /var/www/html;
    index index.php index.html;

    # TrafeX-style performance basics
    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;

    # ---------------------------
    # Compression (gzip)
    # ---------------------------
    # Enable gzip and include common MIME types (NGINX docs) [3](https://mariadb.com/docs/server/mariadb-quickstart-guides/mariadb-connection-troubleshooting-guide)
    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------------------------
    # Your Apache rewrite:
    # RewriteRule ^foto(.*) index.php?file=$1
    # ---------------------------
    # Use ^~ so this location wins for /foto/... paths
    location ^~ /foto/ {
        rewrite ^/foto/(.*)$ /index.php?file=/$1 last;
    }

    # Also catch "/fotoSomething" (because your Apache regex matched ^foto(.*) too)
    location ~ ^/foto(.*)$ {
        rewrite ^/foto(.*)$ /index.php?file=$1 last;
    }

