server {
    listen 8080;
    listen [::]:8080;

    server_name photo.tcit.nl;
    root /var/www/html;
    index index.php index.html;

    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;

    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rewrite /foto/*
    location ^~ /foto/ {
        rewrite ^/foto/(.*)$ /index.php?file=/$1 last;
    }

    location ~ ^/foto(.*)$ {
        rewrite ^/foto(.*)$ /index.php?file=$1 last;
    }

    # ✅ PHP HANDLER (THIS WAS MISSING)
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}