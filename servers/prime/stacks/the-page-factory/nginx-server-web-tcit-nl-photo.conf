server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Performance basics (TrafeX already uses some of these defaults)
    sendfile off;
    tcp_nodelay on;
    absolute_redirect off;

    # --- Your .htaccess rewrite: ^foto(.*) -> /index.php?file=$1 ---
    location ~ ^/foto(.*)$ {
        rewrite ^/foto(.*)$ /index.php?file=$1 last;
    }

    # Main routing:
    # - serve static files if present
    # - otherwise fall back to index.php (TrafeX default style)
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP handling (TrafeX default: php-fpm via unix socket)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    # ---------------------------
    # Static asset caching (improved)
    # ---------------------------
    # TrafeX default caches some assets for 5 days. [3](https://github.com/TrafeX/docker-php-nginx/blob/master/config/conf.d/default.conf)
    # Here we extend it and add Cache-Control to make browser caching explicit.
    location ~* \.(?:css|js|mjs|map|jpg|jpeg|gif|png|webp|svg|ico|bmp|tif|tiff|ttf|otf|eot|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Cache HTML lightly (optional but often useful for “mostly static” pages)
    location ~* \.(?:html)$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # ---------------------------
    # Gzip compression (for text assets)
    # ---------------------------
    # NGINX docs: enable gzip with `gzip on;` and extend mime types via `gzip_types`. [4](https://docs.nginx.com/nginx/admin-guide/web-server/compression/)
    gzip on;
    gzip_min_length 1000;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------------------------
    # Security: block dotfiles (TrafeX default behavior) [3](https://github.com/TrafeX/docker-php-nginx/blob/master/config/conf.d/default.conf)
    # ---------------------------
    location ~ /\. {
        log_not_found off;
        deny all;
    }

    # Error pages (TrafeX default pattern) [3](https://github.com/TrafeX/docker-php-nginx/blob/master/config/conf.d/default.conf)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/lib/nginx/html;
    }

    # Allow fpm status/ping only from localhost (TrafeX default) [3](https://github.com/TrafeX/docker-php-nginx/blob/master/config/conf.d/default.conf)
    location ~ ^/(fpm-status|fpm-ping)$ {
        access_log off;
        allow 127.0.0.1;
        deny all;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
    }
}