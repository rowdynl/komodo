# The Page Factory™ - A sitcom of questionable logic, unexpected errors, and NGINX keeping the whole cast from burning the place down.
name: the-page-factory

services:

  web-festinalentebock-nl:
    image: trafex/php-nginx:latest
    container_name: web-festinalentebock-nl
    volumes:
      - web-festinalentebock.nl:/var/www/html
    networks:
      - backend
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-festinalentebock-nl.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.web-festinalentebock-nl.rule=Host(`festinalentebock.nl`) || Host(`www.festinalentebock.nl`)"
      - "traefik.http.routers.web-festinalentebock-nl.entrypoints=websecure"
      - "traefik.http.routers.web-festinalentebock-nl.tls.certresolver=letsencrypt_http"      
      - "traefik.http.services.web-festinalentebock-nl.loadbalancer.server.port=8080"

  web-tcit-nl-dump:
    image: trafex/php-nginx:latest
    container_name: web-tcit-nl-dump
    volumes:
      - web-tcit.nl-dump:/var/www/
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-tcit-nl-dump.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.web-tcit-nl-dump.rule=Host(`dump.${DOMAIN}`)"
      - "traefik.http.routers.web-tcit-nl-dump.entrypoints=websecure"
      - "traefik.http.routers.web-tcit-nl-dump.tls.certresolver=letsencrypt"      
      - "traefik.http.services.web-tcit-nl-dump.loadbalancer.server.port=8080"

  web-tcit-nl-photo:
    image: trafex/php-nginx:latest
    container_name: web-tcit-nl-photo
    volumes:
      - web-tcit.nl-photo:/etc/nginx:ro
      - web-tcit.nl-photo:/var/www
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-tcit-nl-photo.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.web-tcit-nl-photo.rule=Host(`photo.${DOMAIN}`)"
      - "traefik.http.routers.web-tcit-nl-photo.entrypoints=websecure"
      - "traefik.http.routers.web-tcit-nl-photo.tls.certresolver=letsencrypt"      
      - "traefik.http.services.web-tcit-nl-photo.loadbalancer.server.port=8080"

  web-tcit-nl-tesla:
    image: nginx:alpine
    container_name: web-tcit-nl-tesla
    volumes:
      - web-tcit.nl-tesla:/usr/share/nginx/html:ro
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-tcit-nl-tesla.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.web-tcit-nl-tesla.rule=Host(`tesla.${DOMAIN}`)"
      - "traefik.http.routers.web-tcit-nl-tesla.entrypoints=websecure"
      - "traefik.http.routers.web-tcit-nl-tesla.tls.certresolver=letsencrypt"      
      - "traefik.http.services.web-tcit-nl-tesla.loadbalancer.server.port=80"      
  
  web-tcit-nl-wiki:
    image: mediawiki:1.34
    container_name: web-tcit-nl-wiki
    volumes:
      - web-tcit.nl-wiki:/var/www/html
    networks:
      - backend
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-tcit-nl-wiki.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.web-tcit-nl-wiki.rule=Host(`wiki.${DOMAIN}`)"
      - "traefik.http.routers.web-tcit-nl-wiki.entrypoints=websecure"
      - "traefik.http.routers.web-tcit-nl-wiki.tls.certresolver=letsencrypt"      
      - "traefik.http.services.web-tcit-nl-wiki.loadbalancer.server.port=443"      
  
  web-venlosevrind-nl:
    image: trafex/php-nginx:latest
    container_name: web-venlosevrind-nl
    volumes:
      - web-venlosevrind.nl:/var/www/html
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-venlosevrind-nl.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.routers.web-venlosevrind-nl.rule=Host(`venlosevrind.nl`) || Host(`www.venlosevrind.nl`)"
      - "traefik.http.routers.web-venlosevrind-nl.entrypoints=websecure"
      - "traefik.http.routers.web-venlosevrind-nl.tls.certresolver=letsencrypt_http"      
      - "traefik.http.services.web-venlosevrind-nl.loadbalancer.server.port=8080"

networks:
  backend:
    external: true
  web:
    external: true

volumes:
  web-festinalentebock.nl:
    external: true
  web-tcit.nl-dump:
    external: true
  web-tcit.nl-photo:
    external: true
  web-tcit.nl-tesla:
    external: true
  web-tcit.nl-wiki:
    external: true
  web-venlosevrind.nl:
    external: true