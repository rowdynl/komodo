      - traefik.http.routers.web-tcit-nl-tesla.entrypoints=websecure
      - traefik.http.routers.web-tcit-nl-tesla.middlewares=umami@file
      - traefik.http.routers.web-tcit-nl-tesla.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.web-tcit-nl-tesla.rule=Host(`tesla.${DOMAIN}`)
      - traefik.http.routers.web-tcit-nl-tesla.tls.certresolver=letsencrypt      
      - traefik.http.services.web-tcit-nl-tesla.loadbalancer.server.port=80      
  
  web-tcit-nl-tuning:
    image: trafex/php-nginx:latest
    container_name: web-tcit-nl-tuning
    volumes:
      - web-tcit.nl-tuning:/var/www/html:ro
    networks:
      - web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-tcit-nl-tuning.entrypoints=websecure
      - traefik.http.routers.web-tcit-nl-tuning.middlewares=umami@file
      - traefik.http.routers.web-tcit-nl-tuning.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.web-tcit-nl-tuning.rule=Host(`tuning.${DOMAIN}`)
      - traefik.http.routers.web-tcit-nl-tuning.tls.certresolver=letsencrypt      
      - traefik.http.services.web-tcit-nl-tuning.loadbalancer.server.port=8080      
  
  web-tcit-nl-wiki:
    image: mediawiki:1.34
    container_name: web-tcit-nl-wiki
    volumes:
      - web-tcit.nl-wiki:/var/www/html
    networks:
      - backend
      - web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-tcit-nl-wiki.entrypoints=websecure
      - traefik.http.routers.web-tcit-nl-wiki.middlewares=umami@file
      - traefik.http.routers.web-tcit-nl-wiki.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.web-tcit-nl-wiki.rule=Host(`wiki.${DOMAIN}`)
      - traefik.http.routers.web-tcit-nl-wiki.tls.certresolver=letsencrypt      
      - traefik.http.services.web-tcit-nl-wiki.loadbalancer.server.port=443      
  
