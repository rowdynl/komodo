      - traefik.http.routers.web-tcit-nl-photo.tls.certresolver=letsencrypt      
      - traefik.http.services.web-tcit-nl-photo.loadbalancer.server.port=8080

  web-tcit-nl-tesla:
    image: nginx:alpine
    container_name: web-tcit-nl-tesla
    volumes:
      - web-tcit.nl-tesla:/usr/share/nginx/html:ro
    networks:
      - web
    restart: unless-stopped
