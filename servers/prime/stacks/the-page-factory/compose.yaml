# The Page Factory™ - A sitcom of questionable logic, unexpected errors, and NGINX keeping the whole cast from burning the place down.
name: the-page-factory

services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: umami
    env_file: ./env/umami.env
    networks:
      - backend
      - cache
      - web      
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - flame.type=application
      - flame.category=Analytics
      - flame.name=Umami
      - flame.url=https://umami.${DOMAIN}
      - flame.icon=chart-bar
      - traefik.enable=true
      - traefik.http.routers.umami-public.rule=Host(`umami.${DOMAIN}`) && (Path(`/script.js`) || Path(`/api/send`) || PathPrefix(`/umami/`))
      - traefik.http.routers.umami-public.entrypoints=websecure
      - traefik.http.routers.umami-public.tls=true
      - traefik.http.routers.umami-public.service=umami
      - traefik.http.routers.umami.rule=Host(`umami.${DOMAIN}`)
      - traefik.http.routers.umami.entrypoints=websecure
      - traefik.http.routers.umami.tls.certresolver=letsencrypt
      - traefik.http.routers.umami.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.umami.middlewares=authentik@file
      - traefik.http.services.umami.loadbalancer.server.port=3000

  web-festinalentebock-nl:
    image: trafex/php-nginx:latest
    container_name: web-festinalentebock-nl
    volumes:
      - web-festinalentebock.nl:/var/www/html
    networks:
      - backend
      - web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-festinalentebock-nl.entrypoints=websecure
      - traefik.http.routers.web-festinalentebock-nl.middlewares=umami@file
      - traefik.http.routers.web-festinalentebock-nl.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.web-festinalentebock-nl.rule=Host(`festinalentebock.nl`)
      - traefik.http.routers.web-festinalentebock-nl.tls.certresolver=letsencrypt_http
      - traefik.http.routers.web-festinalentebock-nl-redirect.entrypoints=websecure
      - traefik.http.routers.web-festinalentebock-nl-redirect.middlewares=redirect301@file
      - traefik.http.routers.web-festinalentebock-nl-redirect.priority=301
      - traefik.http.routers.web-festinalentebock-nl-redirect.tls.certresolver=letsencrypt_http
      - traefik.http.routers.web-festinalentebock-nl-redirect.rule=Host(`www.festinalentebock.nl`)
      - traefik.http.services.web-festinalentebock-nl.loadbalancer.server.port=8080

  
  web-rowdy-nl-dev:
    image: wordpress:php8.3-fpm-alpine
    container_name: web-rowdy-nl-dev
    restart: unless-stopped
    env_file: ./env/dev.rowdy.nl.env
    volumes:
      - web-rowdy.nl-dev:/var/www/html
    networks:
      - backend
      - web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-rowdy-nl-dev.entrypoints=websecure
      - traefik.http.routers.web-rowdy-nl-dev.middlewares=umami@file
      - traefik.http.routers.web-rowdy-nl-dev.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.web-rowdy-nl-dev.rule=Host(`dev.rowdy.nl`)
      - traefik.http.routers.web-rowdy-nl-dev.tls.certresolver=letsencrypt_http      
      - traefik.http.services.web-rowdy-nl-dev.loadbalancer.server.port=80


  web-struthofer-nl:
    image: trafex/php-nginx:latest
    container_name: web-struthofer-nl
    volumes:
      - web-struthofer.nl:/var/www/html:ro
    networks:
      - web
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-struthofer-nl.entrypoints=websecure
      - traefik.http.routers.web-struthofer-nl.middlewares=umami@file
      - traefik.http.routers.web-struthofer-nl.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.web-struthofer-nl.rule=Host(`struthofer.${DOMAIN}`)
      - traefik.http.routers.web-struthofer-nl.tls.certresolver=letsencrypt      
      - traefik.http.services.web-struthofer-nl.loadbalancer.server.port=8080 


  web-tcit-nl-dump:
