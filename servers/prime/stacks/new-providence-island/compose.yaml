name: new-providence-island

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - bazarr:/config
      - /mnt/prime-ds/movies:/movies
      - /mnt/prime-ds/series:/series
    ports:
      - 6767:6767
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host('bazarr.${DOMAIN}')"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - lidarr:/config
      - /mnt/prime-ds/music:/music
      - /mnt/downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host('lidarr.${DOMAIN}')"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"

  overseerr:
    container_name: overseerr
    image: sctx/overseerr
    restart: unless-stopped
    volumes:
      - 'overseerr:/app/config'
    ports:
      - '5055:5055'
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.rule=Host('overseerr.${DOMAIN}')"
      - "traefik.http.routers.overseerr.entrypoints=websecure"
      - "traefik.http.routers.overseerr.tls.certresolver=letsencrypt"
      - "traefik.http.services.overseerr.loadbalancer.server.port=32400"

  plex:
    image: 'lscr.io/linuxserver/plex:latest'
    container_name: plex
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=latest
      - TZ=${TZ}
      - plex_HW_ACCEL=true
      - GIDLIST=44,993
      - LIBVA_DRIVER_NAME=iHD
      - LIBVA_MESSAGING_LEVEL=1
      - LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
    devices:
      - '/dev/dri:/dev/dri'    
    device_cgroup_rules:
      - 'c 226:* rmw'    
    group_add:
      - 'video'  # "44"
      - 'render' # "993"
    volumes:
      - 'plex:/config'
      - '/mnt/prime-ds/movies:/volume1/movies'
      - '/mnt/prime-ds/music:/volume1/music'
      - '/mnt/prime-ds/series:/volume1/series'
      - '/mnt/prime-ds/movies:/movies'
      - '/mnt/prime-ds/music:/music'
      - '/mnt/prime-ds/series:/series'
      - '/usr/lib/x86_64-linux-gnu/dri:/usr/lib/x86_64-linux-gnu/dri:ro'
    restart: unless-stopped 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host('plex.${DOMAIN}')"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls.certresolver=letsencrypt"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"
  
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host('prowlarr.${DOMAIN}')"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - radarr:/config
      - /mnt/prime-ds/movies:/movies
      - /mnt/downloads:/downloads
      - /mnt/downloads/transmission/completed:/data/completed
    ports:
      - 7878:7878
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host('radarr.${DOMAIN}')"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
  
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sabnzbd:/config
      - /mnt/downloads:/downloads
    ports:
      - 3389:3389
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sonarr:/config
      - /mnt/downloads:/downloads
      - /mnt/downloads/transmission/completed:/data/completed
      - /mnt/prime-ds/series:/tv
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host('sonarr.${DOMAIN}')"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  transmission:
    image: haugene/transmission-openvpn
    container_name: transmission
    cap_add:
      - NET_ADMIN
    volumes:
      - transmission:/config
      - /mnt/downloads/transmission:/data
      - /mnt/downloads/transmission/watch:/watch
    env_file:
      - transmission.env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - NORDVPN_COUNTRY=${NORDVPN_COUNTRY}
      - OPENVPN_CONFIG=${NORDVPN_COUNTRY}
      - OPENVPN_USERNAME=${OPENVPN_USERNAME}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - TRANSMISSION_RPC_PASSWORD=${TRANSMISSION_RPC_PASSWORD}
      - TRANSMISSION_RPC_USERNAME=${TRANSMISSION_RPC_USERNAME}
    logging:
      driver: json-file
      options:
        max-size: 11m
    ports:
      - 9091:9091
    restart: unless-stoppedlabels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host('transmission.${DOMAIN}')"
      - "traefik.http.routers.transmission.entrypoints=websecure"
      - "traefik.http.routers.transmission.tls.certresolver=letsencrypt"
      - "traefik.http.services.transmission.loadbalancer.server.port=32400"

networks:
  web:
    external: true
  backend:
    external: true

volumes:
  bazarr:
    external: true
  lidarr:
    external: true
  overseerr:
    external: true
  bazarr:
    external: true
  prowlarr:
    external: true
  radarr:
    external: true
  sabnzbd:
    external: true
  sonarr:
    external: true
  transmission:
    external: true