# Where all your movies and shows disappear into the deep… and instantly resurface
# in Plex like nothing ever happened.
name: new-providence-island

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - bazarr:/config
      - /mnt/prime-ds/movies:/movies
      - /mnt/prime-ds/series:/series
    ports:
      - 6767:6767
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - cleanuparr:/config
      - /mnt/downloads:/downloads
    ports:
      - 11011:11011
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://cleanuparr:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.${DOMAIN}`)"
      - "traefik.http.routers.cleanuparr.entrypoints=websecure"
      - "traefik.http.routers.cleanuparr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.cleanuparr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.cleanuparr.loadbalancer.server.port=11011"

  huntarr:
    image: huntarr/huntarr:latest
    container_name: huntarr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - huntarr:/config
    ports:
      - 9705:9705
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.huntarr.rule=Host(`huntarr.${DOMAIN}`)"
      - "traefik.http.routers.huntarr.entrypoints=websecure"
      - "traefik.http.routers.huntarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.huntarr.loadbalancer.server.port=9705"

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - lidarr:/config
      - /mnt/prime-ds/music:/music
      - /mnt/downloads:/downloads
    ports:
      - 8686:8686
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.lidarr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"

  overseerr:
    container_name: overseerr
    image: sctx/overseerr
    networks:
      - web
    restart: unless-stopped
    volumes:
      - 'overseerr:/app/config'
    ports:
      - '5055:5055'
    environment:
      - TZ=${TZ}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.overseerr.rule=Host(`overseerr.${DOMAIN}`)"
      - "traefik.http.routers.overseerr.entrypoints=websecure"
      - "traefik.http.routers.overseerr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.overseerr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.overseerr.loadbalancer.server.port=5055"

  plex:
    image: 'lscr.io/linuxserver/plex:latest'
    container_name: plex
    networks:
      dirty-water:
      macvlan:
        ipv4_address: ${MACVLAN_STATIC_IP_PLEX}
      web:
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VERSION=latest
      - TZ=${TZ}
      - plex_HW_ACCEL=true
      - GIDLIST=44,993
      - LIBVA_DRIVER_NAME=iHD
      - LIBVA_MESSAGING_LEVEL=1
      - LIBVA_DRIVERS_PATH=/usr/lib/x86_64-linux-gnu/dri
    devices:
      - '/dev/dri:/dev/dri'    
    device_cgroup_rules:
      - 'c 226:* rmw'    
    group_add:
      - 'video'  # "44"
      - 'render' # "993"
    volumes:
      - 'plex:/config'
      - '/mnt/prime-ds/movies:/volume1/movies'
      - '/mnt/prime-ds/music:/volume1/music'
      - '/mnt/prime-ds/series:/volume1/series'
      - '/mnt/prime-ds/movies:/movies'
      - '/mnt/prime-ds/music:/music'
      - '/mnt/prime-ds/series:/series'
      - '/usr/lib/x86_64-linux-gnu/dri:/usr/lib/x86_64-linux-gnu/dri:ro'
    restart: unless-stopped 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex.rule=Host(`plex.${DOMAIN}`)"
      - "traefik.http.routers.plex.entrypoints=websecure"
      - "traefik.http.routers.plex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.plex.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.plex.loadbalancer.server.port=32400"

  plex-auto-languages:
    image: remirigal/plex-auto-languages:latest
    container_name: plex-auto-languages
    environment:
      - TZ=${TZ}
    networks:
      dirty-water:
    volumes:      
      - plexautolanguages:/config
    restart: unless-stopped

  posterizarr:
    image: ghcr.io/fscorrupt/posterizarr:latest
    container_name: posterizarr
    environment:
      - TZ=${TZ}
      - TERM=xterm
      - RUN_TIME=disabled
    restart: unless-stopped
    user: ${PUID}:${PGID}
    ports:
      - 8000:8000
    networks:
      - web
    volumes:
      - posterizarr:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.posterizarr.rule=Host(`posterizarr.${DOMAIN}`)"
      - "traefik.http.routers.posterizarr.entrypoints=websecure"
      - "traefik.http.routers.posterizarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.posterizarr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.posterizarr.loadbalancer.server.port=8000"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prowlarr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"


  qbittorrent:
    image: kronflux/qbittorrentvpn:latest
    container_name: qbittorrent
    networks:
      - web
    cap_add:
      - NET_ADMIN
    ports:
      - 8885:8080      # Web UI
      - 8999:8999      # Torrent TCP
      - 8999:8999/udp  # Torrent UDP
    volumes:
      - qbittorrent:/config
      - /mnt/downloads:/downloads
    devices:
      - /dev/net/tun:/dev/net/tun
    #security_opt:
    #  - apparmor:unconfined
    environment:
      - VPN_ENABLED=yes
      - VPN_TYPE=openvpn
      - LAN_NETWORK=${QBITTORRENT_LAN_NETWORKS}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RESTART_CONTAINER=yes
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qbittorrent.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8885"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - radarr:/config
      - /mnt/prime-ds/movies:/movies
      - /mnt/downloads:/downloads
      - /mnt/downloads/transmission/completed:/data/completed
    ports:
      - 7878:7878
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.radarr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
  
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sabnzbd:/config
      - /mnt/downloads:/downloads
    ports:
      - 3389:3389
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sabnzbd.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=3389"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sonarr:/config
      - /mnt/downloads:/downloads
      - /mnt/downloads/transmission/completed:/data/completed
      - /mnt/prime-ds/series:/tv
    ports:
      - 8989:8989
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sonarr.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    networks:
      - web
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - tautulli:/config
    ports:
      - 8181:8181
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tautulli.rule=Host(`tautulli.${DOMAIN}`)"
      - "traefik.http.routers.tautulli.entrypoints=websecure"
      - "traefik.http.routers.tautulli.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tautulli.priority=${TRAEFIK_PRIORITY}"
      - "traefik.http.services.tautulli.loadbalancer.server.port=8181"

networks:
  dirty-water:
    external: true
  web:
    external: true
  macvlan:
    external: true
  backend:
    external: true

volumes:
  bazarr:
    external: true
  cleanuparr:
    external: true
  huntarr:
    external: true
  lidarr:
    external: true
  overseerr:
    external: true
  plex:
    external: true
  plexautolanguages:
    external: true
  posterizarr-assets:
    external: true
  posterizarr-assetsbackup:
    external: true
  posterizarr-config:
    external: true
  posterizarr-manualassets:
    external: true
  prowlarr:
    external: true
  qbittorrent:
    external: true
  radarr:
    external: true
  sabnzbd:
    external: true
  sonarr:
    external: true
  tautulli:
    external: true