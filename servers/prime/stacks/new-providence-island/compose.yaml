# Where all your movies and shows disappear into the deep… and instantly resurface
# in Plex like nothing ever happened.
name: new-providence-island

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - bazarr:/config
      - ${VOLUME_PATH_MOVIES_HOST}:${VOLUME_PATH_MOVIES_CONTAINER}
      - ${VOLUME_PATH_TV_HOST}:${VOLUME_PATH_TV_CONTAINER}
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Bazarr
      - flame.url=https://bazarr.${DOMAIN}
      - flame.icon=subtitles-outline
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)
      - traefik.http.routers.bazarr.entrypoints=websecure
      - traefik.http.routers.bazarr.tls.certresolver=letsencrypt
      - traefik.http.routers.bazarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.bazarr.middlewares=authentik@file
      - traefik.http.services.bazarr.loadbalancer.server.port=6767

  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - cleanuparr:/config
      - ${VOLUME_PATH_DOWNLOADS_HOST}:${VOLUME_PATH_DOWNLOADS_CONTAINER}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://cleanuparr:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=CleanUpArr
      - flame.url=https://cleanuparr.${DOMAIN}
      - flame.icon=broom
      - traefik.enable=true
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.${DOMAIN}`)
      - traefik.http.routers.cleanuparr.entrypoints=websecure
      - traefik.http.routers.cleanuparr.tls.certresolver=letsencrypt
      - traefik.http.routers.cleanuparr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.cleanuparr.middlewares=authentik@file
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011

  kometa:
    image: lscr.io/linuxserver/kometa:latest
    container_name: kometa
    networks:
      - dirty-water
    env_file:
      - ../../../global.env
    volumes:
      - kometa:/config
    restart: unless-stopped

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - lidarr:/config
      - ${VOLUME_PATH_MUSIC_HOST}:${VOLUME_PATH_MUSIC_CONTAINER}
      - ${VOLUME_PATH_DOWNLOADS_HOST}:${VOLUME_PATH_DOWNLOADS_CONTAINER}
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Lidarr
      - flame.url=https://lidarr.${DOMAIN}
      - flame.icon=music-clef-treble
      - traefik.enable=true
      - traefik.http.routers.lidarr.rule=Host(`lidarr.${DOMAIN}`)
      - traefik.http.routers.lidarr.entrypoints=websecure
      - traefik.http.routers.lidarr.tls.certresolver=letsencrypt
      - traefik.http.routers.lidarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.services.lidarr.loadbalancer.server.port=8686

  plex:
    image: 'lscr.io/linuxserver/plex:latest'
    container_name: plex
    networks:
      dirty-water:
      macvlan:
        ipv4_address: ${MACVLAN_STATIC_IP_PLEX}
      web:
    env_file:
      - ../../../global.env
      - plex.env
    devices:
      - '/dev/dri:/dev/dri'    
    device_cgroup_rules:
      - 'c 226:* rmw'    
    group_add:
      - 'video'  # "44"
      - 'render' # "993"
    volumes:
      - plex:/config
      - /usr/lib/x86_64-linux-gnu/dri:/usr/lib/x86_64-linux-gnu/dri:ro
      - ${VOLUME_PATH_MOVIES_HOST}:${VOLUME_PATH_MOVIES_CONTAINER}
      - ${VOLUME_PATH_MUSIC_HOST}:${VOLUME_PATH_MUSIC_CONTAINER}
      - ${VOLUME_PATH_TV_HOST}:${VOLUME_PATH_TV_CONTAINER}
    restart: unless-stopped 
    labels:
      - flame.type=application
      - flame.category=Pirate’s Tavern
      - flame.name=Plex
      - flame.url=https://plex.${DOMAIN}
      - flame.icon=plex
      - flame.order=1
      - traefik.enable=true
      - traefik.http.routers.plex.rule=Host(`plex.${DOMAIN}`)
      - traefik.http.routers.plex.entrypoints=websecure
      - traefik.http.routers.plex.tls.certresolver=letsencrypt
      - traefik.http.routers.plex.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.plex.middlewares=authentik@file
      - traefik.http.services.plex.loadbalancer.server.port=32400

  plex-auto-languages:
    image: remirigal/plex-auto-languages:latest
    container_name: plex-auto-languages
    environment:
      - TZ=${TZ}
    networks:
      dirty-water:
    volumes:      
      - plexautolanguages:/config
    restart: unless-stopped

  posterizarr:
    image: ghcr.io/fscorrupt/posterizarr:latest
    container_name: posterizarr
    environment:
      - TZ=${TZ}
    restart: unless-stopped
    user: ${PUID}:${PGID}
    networks:
      - web
    volumes:
      - posterizarr:/config:rw
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Posterizarr
      - flame.url=https://posterizarr.${DOMAIN}
      - flame.icon=image-search-outline
      - traefik.enable=true
      - traefik.http.routers.posterizarr.rule=Host(`posterizarr.${DOMAIN}`)
      - traefik.http.routers.posterizarr.entrypoints=websecure
      - traefik.http.routers.posterizarr.tls.certresolver=letsencrypt
      - traefik.http.routers.posterizarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.posterizarr.middlewares=authentik@file
      - traefik.http.services.posterizarr.loadbalancer.server.port=8000

  profilarr:
    image: santiagosayshey/profilarr:latest
    container_name: profilarr
    networks:
      - web
    volumes:
      - profilarr:/config
    env_file: ../../../global.env
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Profilarr
      - flame.url=https://profilarr.${DOMAIN}
      - flame.icon=search-web
      - traefik.enable=true
      - traefik.http.routers.profilarr.rule=Host(`profilarr.${DOMAIN}`)
      - traefik.http.routers.profilarr.entrypoints=websecure
      - traefik.http.routers.profilarr.tls.certresolver=letsencrypt
      - traefik.http.routers.profilarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.profilarr.middlewares=authentik@file
      - traefik.http.services.profilarr.loadbalancer.server.port=6868

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - prowlarr:/config
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Prowlarr
      - flame.url=https://prowlarr.${DOMAIN}
      - flame.icon=search-web
      - traefik.enable=true
      - traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls.certresolver=letsencrypt
      - traefik.http.routers.prowlarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.prowlarr.middlewares=authentik@file
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - radarr:/config
      - ${VOLUME_PATH_MOVIES_HOST}:${VOLUME_PATH_MOVIES_CONTAINER}
      - ${VOLUME_PATH_DOWNLOADS_HOST}:${VOLUME_PATH_DOWNLOADS_CONTAINER}
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Radarr
      - flame.url=https://radarr.${DOMAIN}
      - flame.icon=movie-search-outline
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls.certresolver=letsencrypt
      - traefik.http.routers.radarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.radarr.middlewares=authentik@file
      - traefik.http.services.radarr.loadbalancer.server.port=7878
  
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - sabnzbd:/config
      - ${VOLUME_PATH_DOWNLOADS_HOST}:${VOLUME_PATH_DOWNLOADS_CONTAINER}
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Pirate’s Tavern
      - flame.order=4
      - flame.name=SABnzbd
      - flame.url=https://sabnzbd.${DOMAIN}
      - flame.icon=cloud-download-outline
      - traefik.enable=true
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)
      - traefik.http.routers.sabnzbd.entrypoints=websecure
      - traefik.http.routers.sabnzbd.tls.certresolver=letsencrypt
      - traefik.http.routers.sabnzbd.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.sabnzbd.middlewares=authentik@file
      - traefik.http.services.sabnzbd.loadbalancer.server.port=3389
  
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    networks:
      - web
    restart: unless-stopped
    volumes:
      - seerr:/app/config
    env_file: ../../../global.env
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    labels:
      - flame.type=application
      - flame.category=Pirate’s Tavern
      - flame.order=2
      - flame.name=Seerr
      - flame.url=https://seerr.${DOMAIN}
      - flame.icon=movie-search-outline
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.routers.seerr.entrypoints=websecure
      - traefik.http.routers.seerr.tls.certresolver=letsencrypt
      - traefik.http.routers.seerr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.seerr.middlewares=authentik@file
      - traefik.http.services.seerr.loadbalancer.server.port=5055

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - sonarr:/config
      - ${VOLUME_PATH_DOWNLOADS_HOST}:${VOLUME_PATH_DOWNLOADS_CONTAINER}
      - ${VOLUME_PATH_TV_HOST}:${VOLUME_PATH_TV_CONTAINER}
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Sonarr
      - flame.url=https://sonarr.${DOMAIN}
      - flame.icon=movie-search-outline
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls.certresolver=letsencrypt
      - traefik.http.routers.sonarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.sonarr.middlewares=authentik@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    networks:
      - web
    env_file: ../../../global.env
    volumes:
      - tautulli:/config
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Pirate’s Tavern
      - Flame.order=3
      - flame.name=Tautulli
      - flame.url=https://tautulli.${DOMAIN}
      - flame.icon=eye-check-outline
      - traefik.enable=true
      - traefik.http.routers.tautulli.rule=Host(`tautulli.${DOMAIN}`)
      - traefik.http.routers.tautulli.entrypoints=websecure
      - traefik.http.routers.tautulli.tls.certresolver=letsencrypt
      - traefik.http.routers.tautulli.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.tautulli.middlewares=authentik@file
      - traefik.http.services.tautulli.loadbalancer.server.port=8181

  trailarr:
    image: nandyalu/trailarr:latest
    container_name: trailarr
    env_file: 
      - ../../../global.env
      - ./env/trailarr.env
    networks:
      - web
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - trailarr:/config
      - ${VOLUME_PATH_MOVIES_HOST}:${VOLUME_PATH_MOVIES_CONTAINER}
      - ${VOLUME_PATH_TV_HOST}:${VOLUME_PATH_TV_CONTAINER}
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Captain’s Quarters
      - flame.name=Trailarr
      - flame.url=https://trailarr.${DOMAIN}
      - flame.icon=movie-roll
      - traefik.docker.network=web
      - traefik.enable=true
      - traefik.http.routers.trailarr.rule=Host(`trailarr.${DOMAIN}`)
      - traefik.http.routers.trailarr.entrypoints=websecure
      - traefik.http.routers.trailarr.tls.certresolver=letsencrypt
      - traefik.http.routers.trailarr.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.trailarr.middlewares=authentik@file
      - traefik.http.services.trailarr.loadbalancer.server.port=7889

  transmission:
    image: haugene/transmission-openvpn
    container_name: transmission
    networks:
      - web
    cap_add:
      - NET_ADMIN
    volumes:
      - transmission:/config
      - /mnt/downloads/transmission:/downloads/transmission
    env_file:
      - ../../../global.env
      - transmission.env
    ports:
      - 51820:51820
    logging:
      driver: json-file
      options:
        max-size: 11m
    restart: unless-stopped    
    healthcheck:
        disable: true
    labels:
      - flame.type=application
      - flame.category=Pirate’s Tavern
      - flame.order=5
      - flame.name=Transmission
      - flame.url=https://transmission.${DOMAIN}
      - flame.icon=cloud-download-outline
      - traefik.docker.network=web
      - traefik.enable=true
      - traefik.http.routers.transmission.rule=Host(`transmission.${DOMAIN}`)
      - traefik.http.routers.transmission.entrypoints=websecure
      - traefik.http.routers.transmission.tls.certresolver=letsencrypt
      - traefik.http.routers.transmission.priority=${TRAEFIK_PRIORITY}
      - traefik.http.routers.transmission.middlewares=authentik@file
      - traefik.http.services.transmission.loadbalancer.server.port=9091

networks:
  dirty-water:
    external: true
  web:
    external: true
  macvlan:
    external: true
  backend:
    external: true

volumes:
  bazarr:
    external: true
  cleanuparr:
    external: true
  huntarr:
    external: true
  kometa:
    external: true
  lidarr:
    external: true
  seerr:
    external: true
  plex:
    external: true
  plexautolanguages:
    external: true
  posterizarr:
    external: true
  profilarr:
    external: true
  prowlarr:
    external: true
  radarr:
    external: true
  sabnzbd:
    external: true
  sonarr:
    external: true
  tautulli:
    external: true
  trailarr:
    external: true
  transmission:
    external: true