# The Great PDF Graveyard - Thousands of documents enter. None are ever meaningfully tagged again. A carefully curated pile of files with just enough structure to make losing things more frustrating.
name: the-great-pdf-graveyard

services:
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.27
    container_name: gotenberg
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    networks:
    - dms
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
  
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    env_file: ./env/paperless.env
    networks:
      - backend
      - cache
      - web
    volumes:
      - paperless:/usr/src/paperless/folders
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    labels:
      - flame.type=application
      - flame.category=Document Management
      - flame.name=Paperless NG
      - flame.url=https://paperless.${DOMAIN}
      - flame.icon=file-document-multiple-outline
      - flame.order=4
      - traefik.enable=true
      - traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)
      - traefik.http.routers.paperless.entrypoints=websecure
      - traefik.http.routers.paperless.tls.certresolver=letsencrypt
      - traefik.http.routers.paperless.middlewares=umami@file
      - traefik.http.services.paperless.loadbalancer.server.port=8000

  tika:
    image: docker.io/apache/tika:latest
    container_name: tika
    networks:
    - dms
    restart: unless-stopped

networks:
  backend:
    external: true
  cache:
    external: true
  dms:
    external: true
  web:
    external: true

volumes:
  paperless:
    external: true